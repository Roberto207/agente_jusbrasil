[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verificador"
version = "0.1.0"
description = "Verificador de citações jurídicas — Jusbrasil × BRACIS 2026"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
verificador = "verificador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verificador = ["tabelas/*.json", "avaliacao/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
